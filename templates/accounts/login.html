<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EduTrack Intelligence Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background-color: #000000;">

    <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="width: 100%; max-width: 440px;">
        <!-- Header Banner with Logo -->
        <div class="p-4 text-center bg-white border-bottom border-light">
            <img src="/static/images/edutrack_logo.png" alt="EduTrack Logo & Brand" class="img-fluid" style="max-height: 140px; max-width: 280px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));">
        </div>

        <!-- Login Form -->
        <div class="card-body p-4 bg-white">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show border-0 rounded-3 small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold text-dark">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-primary"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" id="username" class="form-control bg-light border-start-0" placeholder="Enter username (e.g. admin)" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-dark">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-success"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" id="password" class="form-control bg-light border-start-0" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary rounded-pill w-100 py-2.5 fw-bold shadow-sm mb-3">
                    <i class="fa-solid fa-right-to-bracket text-white me-2"></i> Sign In to Portal
                </button>
            </form>
        </div>

        <!-- PROMINENT REGISTRATION SECTION BELOW LOGIN -->
        <div class="card-footer p-4 bg-light border-top text-center">
            <h6 class="fw-bold text-dark mb-2"><i class="fa-solid fa-user-plus text-primary me-2"></i>New to EduTrack? Register Below</h6>
            <p class="small text-muted mb-3">Create your student or teacher account to get started.</p>

            <div class="d-grid gap-2">
                <a href="{% url 'register_student' %}" class="btn btn-outline-primary rounded-pill fw-bold py-2">
                    <i class="fa-solid fa-user-graduate me-2"></i> Register New Student Account
                </a>
                <a href="{% url 'register_teacher' %}" class="btn btn-outline-success rounded-pill fw-bold py-2">
                    <i class="fa-solid fa-chalkboard-user me-2"></i> Register New Faculty / Teacher Account
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
